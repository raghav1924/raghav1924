<text x="640" y="112" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#fafafa">−68%</text>
<text x="640" y="146" font-size="16" fill="#8b8b96">manual effort on BRD → schema</text>
</g>
<g class="rise" style="animation-delay:0.27s">
<rect x="918.5" y=".5" width="281" height="187" rx="22" fill="#0e0e11" stroke="#25252c"/>
<rect x="918.5" y=".5" width="281" height="187" rx="22" fill="url(#m3)"/>
<rect x="940" y="1" width="238" height="1" fill="url(#edge)"/>
<circle cx="948" cy="38" r="4" fill="#b794f6"/>
<text class="m" x="962" y="43" font-size="13" letter-spacing="1.6" fill="#8b8b96">UI SYSTEMS</text>
<text x="946" y="112" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#fafafa">40–70%</text>
