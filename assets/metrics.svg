<rect x="22" y="1" width="238" height="1" fill="url(#edge)"/>
<circle cx="30" cy="38" r="4" fill="#8ab4ff"/>
<text class="m" x="44" y="43" font-size="13" letter-spacing="1.6" fill="#8b8b96">EXPERIENCE</text>
<text x="28" y="112" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#fafafa">3+ yrs</text>
<text x="28" y="146" font-size="16" fill="#8b8b96">enterprise SaaS &amp; cloud</text>
</g>
<g class="rise" style="animation-delay:0.09s">
<rect x="306.5" y=".5" width="281" height="187" rx="22" fill="#0e0e11" stroke="#25252c"/>
<rect x="306.5" y=".5" width="281" height="187" rx="22" fill="url(#m1)"/>
<rect x="328" y="1" width="238" height="1" fill="url(#edge)"/>
<circle cx="336" cy="38" r="4" fill="#fbbf24"/>
<text class="m" x="350" y="43" font-size="13" letter-spacing="1.6" fill="#8b8b96">ONBOARDING</text>
<text x="334" y="112" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#fafafa">30 min</text>
<text x="334" y="146" font-size="16" fill="#8b8b96">down from 7–8 months</text>
</g>
<g class="rise" style="animation-delay:0.18s">
<rect x="612.5" y=".5" width="281" height="187" rx="22" fill="#0e0e11" stroke="#25252c"/>
<rect x="612.5" y=".5" width="281" height="187" rx="22" fill="url(#m2)"/>
<rect x="634" y="1" width="238" height="1" fill="url(#edge)"/>
<circle cx="642" cy="38" r="4" fill="#34d399"/>
