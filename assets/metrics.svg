<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="188" viewBox="0 0 1200 188" fill="none" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="m0" cx="100%" cy="0%" r="95%"><stop offset="0" stop-color="#8ab4ff" stop-opacity=".20"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/></radialGradient><radialGradient id="m1" cx="100%" cy="0%" r="95%"><stop offset="0" stop-color="#fbbf24" stop-opacity=".20"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><radialGradient id="m2" cx="100%" cy="0%" r="95%"><stop offset="0" stop-color="#34d399" stop-opacity=".20"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient><radialGradient id="m3" cx="100%" cy="0%" r="95%"><stop offset="0" stop-color="#b794f6" stop-opacity=".20"/><stop offset="1" stop-color="#b794f6" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g class="rise" style="animation-delay:0.00s">
