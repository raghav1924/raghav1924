<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" fill="none" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes sweep{from{transform:translateX(-420px)}to{transform:translateX(1200px)}}
.sw{animation:sweep 4.5s ease-in-out infinite}
</style>
<defs>
<clipPath id="fc"><rect width="1200" height="170" rx="28"/></clipPath>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<radialGradient id="fg" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#b794f6" stop-opacity=".28"/><stop offset="1" stop-color="#b794f6" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ab4ff" stop-opacity="0"/><stop offset=".5" stop-color="#8ab4ff"/><stop offset="1" stop-color="#b794f6" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#fc)"><rect width="1200" height="170" fill="#09090b"/><rect width="1200" height="170" fill="url(#dots)"/><rect width="1200" height="170" fill="url(#fg)"/><rect class="sw" x="0" y="168" width="420" height="2" fill="url(#sweep)"/></g><rect x=".5" y=".5" width="1199" height="169" rx="27.5" stroke="#26262d"/><text x="600.0" y="78" font-size="34" font-weight="700" letter-spacing="-.8" text-anchor="middle" fill="#fafafa">Ship it. Learn from it. Scale it.</text><text class="m" x="600.0" y="116" font-size="15" letter-spacing="1" text-anchor="middle" fill="#8b8b96">thanks for stopping by — let’s build something</text>
</svg>
