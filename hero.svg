<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.15;transform:scale(2.4)}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-10px)}}
.l{opacity:0;animation:cycle 9s ease-in-out infinite}
.l1{opacity:1} .l2{animation-delay:3s} .l3{animation-delay:6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.float{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out -2s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
.drift{animation:drift 14s ease-in-out infinite}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="400" rx="28"/></clipPath>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".08"/></pattern>
<radialGradient id="g1" cx="88%" cy="0%" r="62%"><stop offset="0" stop-color="#8ab4ff" stop-opacity=".30"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0%" cy="100%" r="58%"><stop offset="0" stop-color="#b794f6" stop-opacity=".24"/><stop offset="1" stop-color="#b794f6" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#09090b" stop-opacity="0"/><stop offset="1" stop-color="#09090b" stop-opacity=".9"/></radialGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c9ff"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ab4ff" stop-opacity="0"/><stop offset=".5" stop-color="#8ab4ff" stop-opacity=".8"/><stop offset="1" stop-color="#b794f6" stop-opacity="0"/></linearGradient>
</defs>
